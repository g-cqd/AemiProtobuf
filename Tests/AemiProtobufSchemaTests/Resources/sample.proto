syntax = "proto3";

package test.sample;

message Address {
  string street = 1;
  string city = 2;
  int32 zip = 3;
}

message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  bool active = 4;
  double score = 5;
  repeated string tags = 6;
  repeated int32 samples = 7;
  Address address = 8;
  sint32 delta = 9;
  fixed64 stamp = 10;
}
