# Every external tool the quality gates run, pinned. Sourced by Scripts/tools.sh; nothing else reads versions.
#
# Release archives are pinned by version and SHA-256 per platform and checked before anything runs. Baseline fingerprints move
# between tool versions, so an unpinned tool would turn a gate red with no change of ours. To upgrade: change the version and the
# hashes together, and read the findings diff. The analyzers (modeler included) and TLC are swift-ci's: its tool lock pins them.

