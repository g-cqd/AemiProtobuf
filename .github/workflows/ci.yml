name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  AD_TYPECHECK_BUDGET_MS: "250"
  AEMI_TYPECHECK_BUDGET_MS: "250"

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@725d6ab11cfc2b653bdcdd70393817692925ffb0 # swift-ci 725d6ab
    permissions:
      contents: write # reusable publish permission; no archives are configured for this library

  conformance:
    name: Conformance · Protobuf ${{ vars.PROTOBUF_VERSION || '36.2' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    env:
      PROTOBUF_VERSION: ${{ vars.PROTOBUF_VERSION || '36.2' }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@v5
      - name: Cache · Restore SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-conformance-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-conformance-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Setup · Read Swift Version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Setup · Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - name: Build dependencies
        id: deps
        run: |
          brew install abseil ninja
          echo "abseil=$(brew list --versions abseil | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Protobuf sources
        run: git clone --quiet --depth 1 --branch "v$PROTOBUF_VERSION" https://github.com/protocolbuffers/protobuf.git "$RUNNER_TEMP/protobuf"
      - name: Cache the runner build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/protobuf/build
          key: protobuf-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-${{ steps.deps.outputs.abseil }}
      - name: Build conformance_test_runner and protoc
        run: |
          cd "$RUNNER_TEMP/protobuf"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_CONFORMANCE=ON -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_ABSL_PROVIDER=package -Dprotobuf_BUILD_LIBUPB=OFF -DCMAKE_CXX_STANDARD=17
          ninja -C build conformance_test_runner protoc
      - name: Conformance suite
        run: PROTOBUF_SOURCE="$RUNNER_TEMP/protobuf" PROTOC="$RUNNER_TEMP/protobuf/build/protoc" Scripts/conformance.sh

  models:
    name: Verification · Lean, TLA+ & Modeler
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@v5
      - name: Cache · Restore SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-models-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-models-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Setup · Read Swift Version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Setup · Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/aemiprotobuf/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Scripts/tools.lock') }}
      - run: Scripts/tools.sh install tla2tools modeler
      - run: Scripts/model.sh

  bench:
    name: Performance · Allocation Thresholds
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@v5
      - name: Cache · Restore SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-bench-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-bench-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Setup · Read Swift Version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Setup · Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - run: Scripts/quality.sh bench

  mutation:
    name: Mutation · Wire Core
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@v5
      - name: Cache · Restore SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-mutation-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-mutation-${{ runner.os }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Setup · Read Swift Version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Setup · Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - run: Scripts/quality.sh mutation
