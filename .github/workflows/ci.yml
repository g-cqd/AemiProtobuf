# Standalone: every job calls Scripts/quality.sh, the same entry point the git hooks use, so a gate cannot differ between a developer
# machine and CI. No reusable workflow from another repository.
#
# Every job installs the toolchain .swift-version names: the runner image's Swift lags the tools version (its first runs failed on
# 6.3.3 against 6.4). setup-swift is pinned by SHA to the commit aemi's shared workflow uses.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**", ".gitignore", ".githooks/**"]
  pull_request:
    paths-ignore: ["README.md", "docs/**", ".gitignore", ".githooks/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: the mutation job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Format, lint, analyzers
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - run: brew install swiftlint
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/aemiprotobuf/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Scripts/tools.lock') }}
      - run: Scripts/quality.sh fast

  test:
    name: Tests (debug and release)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - run: Scripts/quality.sh test

  conformance:
    name: Conformance (protobuf ${{ vars.PROTOBUF_VERSION || '36.2' }})
    runs-on: macos-26
    env:
      PROTOBUF_VERSION: ${{ vars.PROTOBUF_VERSION || '36.2' }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - name: Build dependencies
        id: deps
        run: |
          brew install abseil ninja
          echo "abseil=$(brew list --versions abseil | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Protobuf sources
        run: git clone --quiet --depth 1 --branch "v$PROTOBUF_VERSION" https://github.com/protocolbuffers/protobuf.git "$RUNNER_TEMP/protobuf"
      - name: Cache the runner build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/protobuf/build
          key: protobuf-${{ env.PROTOBUF_VERSION }}-${{ runner.os }}-${{ steps.deps.outputs.abseil }}
      - name: Build conformance_test_runner and protoc
        run: |
          cd "$RUNNER_TEMP/protobuf"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_CONFORMANCE=ON -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_ABSL_PROVIDER=package -Dprotobuf_BUILD_LIBUPB=OFF -DCMAKE_CXX_STANDARD=17
          ninja -C build conformance_test_runner protoc
      - name: Conformance suite
        run: PROTOBUF_SOURCE="$RUNNER_TEMP/protobuf" PROTOC="$RUNNER_TEMP/protobuf/build/protoc" Scripts/conformance.sh

  models:
    name: Lean, TLA+ (TLC), modeler
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/aemiprotobuf/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Scripts/tools.lock') }}
      - run: Scripts/tools.sh install tla2tools modeler
      - run: Scripts/model.sh

  bench:
    name: Allocation thresholds
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - run: Scripts/quality.sh bench

  mutation:
    name: Mutation testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        id: toolchain
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Install Swift ${{ steps.toolchain.outputs.version }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ steps.toolchain.outputs.version }}
      - run: Scripts/quality.sh mutation
